{% if is_paginated %}
  <nav class="management-pagination" aria-label="Paginação">
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    <div>
      {% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?q={{ search_query|urlencode }}&amp;page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
      {% if page_obj.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?q={{ search_query|urlencode }}&amp;page={{ page_obj.next_page_number }}">Próxima</a>{% endif %}
    </div>
  </nav>
{% endif %}
