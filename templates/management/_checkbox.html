<div class="form-check">
  {{ field }}
  <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required or required_override %} <span class="text-danger">*</span>{% endif %}</label>
  {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
